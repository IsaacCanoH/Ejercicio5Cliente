name: CI Cliente

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar:
    name: Pruebas y Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      MONITORING_USERNAME: monitor_ci
      MONITORING_PASSWORD: monitoreo_ci_temporal

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v7

      - name: Preparar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar y ejecutar pruebas
        run: bash ./mvnw -B -ntp clean verify

      - name: Guardar reportes de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-cliente
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 7

      - name: Construir imagen Docker
        run: docker build --tag gestor-cliente:ci .